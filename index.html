<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo-icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="X2KwzZq-EQSujt9OBzLfAlQxX8bzHPvrJwTM_6IkB4A" />

    <!-- Feed autodiscovery — lets crawlers and readers find the news feed
         from any page, not only via robots.txt. -->
    <link rel="alternate" type="application/rss+xml" title="AI News — Social Dev Technologies" href="/news-rss.xml" />

    <!-- Google tag (gtag.js) — the config/dataLayer bootstrap lives in
         /gtag-init.js rather than inline here because this site's CSP has
         no script-src 'unsafe-inline' (see vercel.json).
         Both are off the critical path: without `defer` the bootstrap was
         render-blocking, and because it sat ahead of the app bundle in the
         document it pushed /assets/index.js to the end of a 4-request
         critical chain (Lighthouse: 1,379ms max critical path latency).
         Deferring is safe here — gtag-init.js guards with
         `window.dataLayer = window.dataLayer || []`, so it doesn't matter
         whether it or the async gtag.js runs first; commands queue either
         way. gtag.js itself is no longer requested here — /gtag-init.js
         loads it once the browser goes idle. It's ~164KB of third-party JS
         that nothing on screen depends on, and even as `async` it competed
         for CPU during load (Lighthouse: 68.6KB of it unused). Commands are
         queued into dataLayer immediately either way, so nothing is lost
         for anyone who stays on the page. -->
    <script defer src="/gtag-init.js"></script>

    <!-- Preconnects: fonts and YouTube video thumbnails are on the critical
         path from the very first paint, so warm the connections up front
         instead of waiting for CSS/JS discovery to find them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- No i.ytimg.com preconnect: the homepage hero now uses a self-hosted
         /video-thumbnail.jpg, so that origin is never requested on first
         load and Lighthouse flagged the hint as unused. AgentModal still
         falls back to i.ytimg.com, but only after a user opens a modal —
         far too late for a preconnect to have helped. -->
    <!-- Loaded as non-render-blocking: media="print" makes the browser fetch
         it at full priority without waiting for it before first paint.
         src/main.jsx flips data-defer-font links to media="all" once each
         has loaded (NOT an inline onload= attribute — this site's CSP
         script-src has no 'unsafe-inline', which would silently block it).
         Every font is already requested with &display=swap, so text renders
         immediately in the fallback font and swaps in once these apply —
         deferring just moves *when* that swap can start. The noscript
         fallback covers JS-disabled visits. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      media="print"
      data-defer-font
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
      media="print"
      data-defer-font
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" />
    </noscript>

    <!-- Primary SEO -->
    <title>Social Dev Technologies — Learn AI & Digital Skills in Africa</title>
    <meta name="description" content="Build real Artificial Intelligence (AI) agents with Claude. 25 guided sessions across Builder 1 and Builder 2, plus portfolio-ready projects. Africa's leading AI skills platform." />
    <meta name="keywords" content="Artificial Intelligence, AI skills, Africa, learn AI, Claude AI, agent building, digital skills, Nigeria, tech education, Builder 1, Builder 2, BYU Pathway" />
    <meta name="author" content="Social Dev Technologies" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn previews)

         og:image MUST be a 1200x630 landscape image, NOT the logo. It
         pointed at /logo.jpeg (192x192) until 2026-08-19, which is below
         LinkedIn's 1200x627 threshold for a large card AND below Facebook's
         200x200 floor — so every link shared from this site rendered as a
         text-only row or a tiny thumbnail. /public/og/*.jpg are generated by
         scripts/generate-og-cards.mjs (`npm run og-cards`); the API routes
         under /api swap in a more specific card per section/article.
         og:image:width/height let LinkedIn reserve the large-card layout
         before it has finished downloading the image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Social Dev Technologies" />
    <meta property="og:url" content="https://socialdevtechnologies.com" />
    <meta property="og:title" content="Social Dev Technologies — Learn AI & Digital Skills" />
    <meta property="og:description" content="Build real Artificial Intelligence (AI) agents. 25 guided sessions across Builder 1 and Builder 2, plus portfolio projects. Join builders across Africa." />
    <meta property="og:image" content="https://socialdevtechnologies.com/og/default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Social Dev Technologies — build real AI agents." />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Social Dev Technologies — Learn AI & Digital Skills" />
    <meta name="twitter:description" content="Build real AI agents with Claude. Africa's #1 AI skills platform." />
    <meta name="twitter:image" content="https://socialdevtechnologies.com/og/default.jpg" />

    <!-- Theme colour (browser chrome on Android) -->
    <meta name="theme-color" content="#7C3AED" />

    <!-- iOS "Add to Home Screen" support — Safari doesn't read the web
         manifest for these, they're Apple-specific meta/link tags.
         vite-plugin-pwa injects <link rel="manifest"> automatically at
         build time; these three it does not, so they're added here by
         hand. -->
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SDT" />

    <!-- Structured data: organization identity + sitelinks search box -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Social Dev Technologies",
        "url": "https://socialdevtechnologies.com",
        "logo": "https://socialdevtechnologies.com/logo.jpeg",
        "description": "Build real Artificial Intelligence (AI) agents with Claude. 25 guided sessions across Builder 1 and Builder 2, plus portfolio-ready projects. Africa's leading AI skills platform.",
        "sameAs": [
          "https://www.linkedin.com/company/social-dev-technologies/",
          "https://www.facebook.com/SocialDevTech/"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Social Dev Technologies",
        "url": "https://socialdevtechnologies.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://socialdevtechnologies.com/catalog?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
