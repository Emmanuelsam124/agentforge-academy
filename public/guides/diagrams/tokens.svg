<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tk-title tk-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="tk-title">A sentence broken into tokens</title>
  <desc id="tk-desc">The sentence "Tokenization splits rare words into familiar pieces." broken into 10 colored token chunks. "Tokenization" splits into two pieces, Token and ization, because the whole word is uncommon enough that the tokenizer never learned it as a single unit. Every other word here is common enough to stay as one token, and the closing period is its own token. Total: 10 tokens for 52 characters and 7 words, close to the rule-of-thumb ratio of about 4 characters or three-quarters of a word per token in English.</desc>

  <text x="30" y="28" font-size="12" font-weight="700" fill="#5A5473" letter-spacing="0.3">THE SENTENCE, AS THE MODEL ACTUALLY SEES IT</text>

  <!-- Token chips: x positions hand-fit to text width, ~7.2px/char at 13.5px monospace -->
  <!-- 1: Token -->
  <rect x="30" y="44" width="58" height="34" rx="8" fill="#7C3AED"/>
  <text x="59" y="66" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#FFFFFF" text-anchor="middle">Token</text>
  <!-- 2: ization -->
  <rect x="92" y="44" width="72" height="34" rx="8" fill="#2563EB"/>
  <text x="128" y="66" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#FFFFFF" text-anchor="middle">ization</text>
  <!-- 3: " splits" -->
  <rect x="168" y="44" width="76" height="34" rx="8" fill="#059669"/>
  <text x="206" y="66" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#FFFFFF" text-anchor="middle">splits</text>
  <!-- 4: " rare" -->
  <rect x="248" y="44" width="58" height="34" rx="8" fill="#EA580C"/>
  <text x="277" y="66" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#FFFFFF" text-anchor="middle">rare</text>
  <!-- 5: " words" -->
  <rect x="310" y="44" width="70" height="34" rx="8" fill="#DB2777"/>
  <text x="345" y="66" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#FFFFFF" text-anchor="middle">words</text>
  <!-- 6: " into" -->
  <rect x="384" y="44" width="56" height="34" rx="8" fill="#0891B2"/>
  <text x="412" y="66" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#FFFFFF" text-anchor="middle">into</text>
  <!-- 7: " familiar" -->
  <rect x="444" y="44" width="92" height="34" rx="8" fill="#7C3AED"/>
  <text x="490" y="66" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#FFFFFF" text-anchor="middle">familiar</text>
  <!-- 8: " pieces" -->
  <rect x="540" y="44" width="76" height="34" rx="8" fill="#2563EB"/>
  <text x="578" y="66" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#FFFFFF" text-anchor="middle">pieces</text>
  <!-- 9: "." -->
  <rect x="620" y="44" width="34" height="34" rx="8" fill="#059669"/>
  <text x="637" y="66" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#FFFFFF" text-anchor="middle">.</text>

  <!-- bracket under tokens 1-2 -->
  <path d="M30,90 L30,98 L164,98 L164,90 M97,98 L97,108" fill="none" stroke="#5A5473" stroke-width="1.5"/>
  <text x="30" y="126" font-size="12" fill="#5A5473">One word, two tokens: "tokenization" isn't common enough</text>
  <text x="30" y="142" font-size="12" fill="#5A5473">to have earned a single token of its own.</text>

  <rect x="30" y="176" width="740" height="1" fill="#E6DDFA"/>

  <text x="30" y="208" font-size="26" font-weight="800" fill="#1A1333">10</text>
  <text x="62" y="208" font-size="13.5" fill="#3A3358" font-weight="600">tokens</text>
  <text x="30" y="228" font-size="12" fill="#5A5473">for a 7-word, 52-character sentence</text>

  <text x="260" y="208" font-size="13.5" fill="#3A3358" font-weight="600">Rule of thumb (English):</text>
  <text x="260" y="228" font-size="12" fill="#5A5473">~4 characters per token, or about 3 tokens for every 4 words</text>

  <text x="30" y="264" font-size="12" fill="#5A5473">Exact boundaries are model-specific — the tokenizer that ships with a model decides where the cuts fall,</text>
  <text x="30" y="280" font-size="12" fill="#5A5473">and two different models can slice the very same sentence into a different number of tokens.</text>
</svg>
